name: Deploy frontend to GitHub Pages

# Deploy automatically after frontend changes reach the main branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # The workflow reads the repository and publishes a Pages artifact.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This confirms that the repository is configured to use Pages Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Publish only the browser-facing files, not backend or documentation files.
      - name: Prepare frontend files
        run: |
          mkdir _site
          cp index.html style.css script.js _site/
          cp -R pages _site/pages

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Deploy the prepared artifact to the GitHub Pages environment.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
